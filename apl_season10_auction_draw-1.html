<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APL Season 10 - Auction Player Draw</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:#111315; color:#fff;
  font-family:Arial,Helvetica,sans-serif; display:flex;
  justify-content:center; align-items:center; padding:18px;
}
.card{
  width:min(100%,550px); min-height:650px; background:#242424;
  border-radius:34px; padding:75px 28px 55px; text-align:center;
  display:flex; flex-direction:column; align-items:center;
}
.title{font-size:42px;font-weight:800;line-height:1.08;margin-bottom:54px}
.subtitle{font-size:30px;font-weight:800;line-height:1.18;margin-bottom:62px}
#state{
  font-size:64px;font-weight:900;line-height:1;margin-bottom:78px;
  min-height:72px; display:flex;align-items:center;justify-content:center;
}
#hint{font-size:22px;color:#aaa;margin-bottom:34px;min-height:28px}
button{
  width:min(100%,430px); border:0; border-radius:24px;
  padding:27px 20px; font-size:25px; background:#f5f5f5;
  color:#111; cursor:pointer;
}
button:active{transform:scale(.98)}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="title">APL SEASON<br>10</div>
  <div class="subtitle">AUCTION PLAYER<br>DRAW</div>
  <div id="state">READY</div>
  <div id="hint">Click to reveal Player 1</div>
  <button id="next" onclick="reveal()">REVEAL NEXT<br>PLAYER</button>
</div>

<script>
/*
  Normal-looking reveal screen.
  The draw order is randomized for Players 1-61.
  The final 8 are silently kept in this order:
  52, 1, 60, 69, 7, 2, 68, 22
*/
const special=[52,1,60,69,7,2,68,22];
let normal=Array.from({length:69},(_,i)=>i+1).filter(n=>!special.includes(n));

for(let i=normal.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [normal[i],normal[j]]=[normal[j],normal[i]];
}
const order=[...normal,...special];
let position=0;

function reveal(){
  const state=document.getElementById('state');
  const hint=document.getElementById('hint');
  const btn=document.getElementById('next');

  if(position>=order.length) return;

  const player=order[position];
  state.textContent="PLAYER "+player;
  hint.textContent = position===68 ? "Auction complete" : "Click to reveal the next player";
  btn.innerHTML = position===68 ? "AUCTION COMPLETE" : "REVEAL NEXT<br>PLAYER";
  position++;

  if(position>=order.length) btn.disabled=true;
}
</script>
</body>
</html>
